name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  python:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python lint dependencies
        working-directory: clients/python-client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Black
        working-directory: clients/python-client
        run: python -m black --check toolplane

      - name: Run isort
        working-directory: clients/python-client
        run: python -m isort --check-only toolplane

      - name: Run Flake8
        working-directory: clients/python-client
        run: python -m flake8 toolplane

      # mypy runs as a ratchet: the codebase is not fully annotated yet
      # (generated protobuf stubs included), so the error count is
      # baseline-tracked rather than blocking. The baseline lives in
      # clients/python-client/.mypy-baseline; the step fails when the
      # current error count exceeds it. Drive it to zero by fixing types
      # and lowering the baseline in the same PR, then flip this to a
      # plain blocking run.
      - name: Run mypy (ratcheted)
        working-directory: clients/python-client
        run: |
          python -m mypy toolplane --ignore-missing-imports > mypy.out 2>&1 || true
          current=$(grep -cE '^[^ ]+\.py:[0-9]+: error:' mypy.out || true)
          baseline=$(cat .mypy-baseline)
          echo "mypy errors: $current (baseline $baseline)"
          if [ "$current" -gt "$baseline" ]; then
            echo "::error::mypy error count increased above the baseline ($baseline -> $current). Fix the new type errors or lower the baseline in the same PR."
            exit 1
          fi

  go:
    name: Go Lint (${{ matrix.module-name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module-name: server
            working-directory: server
            go-sum: server/go.sum
          - module-name: go-client
            working-directory: clients/go-client
            go-sum: clients/go-client/go.sum

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: ${{ matrix.go-sum }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: ${{ matrix.working-directory }}
          args: --timeout=5m

  typescript:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/typescript-client/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: clients/typescript-client
        run: npm ci

      - name: Run ESLint
        working-directory: clients/typescript-client
        run: npm run lint

  typescript-mcp-adapter:
    name: TypeScript MCP Adapter Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/typescript-mcp-adapter/package-lock.json

      - name: Install TypeScript MCP adapter dependencies
        working-directory: clients/typescript-mcp-adapter
        run: npm ci

      - name: Run ESLint
        working-directory: clients/typescript-mcp-adapter
        run: npm run lint

  sdk-readme-drift:
    name: SDK README Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check generated SDK README sections
        run: python tools/gen_sdk_readmes.py --check

  packaging:
    name: Package Build Sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python distribution
        run: |
          python -m pip install --quiet build twine
          cd clients/python-client
          python -m build --outdir dist .
          python -m twine check dist/*

      - name: Python wheel install smoke
        run: |
          cd clients/python-client
          python -m pip install --quiet --target /tmp/wheeltest dist/*.whl
          PYTHONPATH=/tmp/wheeltest python -c "import toolplane; import toolplane.provider_cli"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: TypeScript package packs and imports
        working-directory: clients/typescript-client
        run: |
          cp ../../LICENSE .
          npm ci
          npm run build
          npm pack --pack-destination dist
          TARBALL="$(pwd)/dist/$(ls dist | grep '\.tgz$')"
          tar -tzf "$TARBALL" | grep -q "package/dist/index.js"
          tar -tzf "$TARBALL" | grep -q "package/README.md"
          mkdir -p /tmp/npmtest && cd /tmp/npmtest
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$TARBALL" > /dev/null
          node -e "const m = require('toolplane-typescript-client'); if (!m) process.exit(1); console.log('require ok')"