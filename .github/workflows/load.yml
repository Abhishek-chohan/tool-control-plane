name: Load

# Sustained-load evidence, never a per-PR gate: a nightly soak against
# Postgres with leak assertions in the report, plus a dispatchable knob
# for on-demand runs. The report artifact is the deliverable.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Soak duration"
        required: false
        default: "30m"
        type: string
      shape:
        description: "Workload shape"
        required: false
        default: "mixed"
        type: choice
        options:
          - mixed
          - agent-turn
          - token-stream
          - heartbeat-fleet
          - discovery-churn

concurrency:
  group: load
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toolplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toolplane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TOOLPLANE_STORAGE_MODE: postgres
      TOOLPLANE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/toolplane?sslmode=disable
      TOOLPLANE_ENV_MODE: development
      TOOLPLANE_AUTH_MODE: fixed
      TOOLPLANE_AUTH_FIXED_API_KEY: toolplane-load-workflow-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Soak
        working-directory: server
        run: |
          mkdir -p bin
          make soak SOAK_DURATION="${{ github.event.inputs.duration || '30m' }}" SHAPE="${{ github.event.inputs.shape || 'mixed' }}"

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: server/bin/soak-report.json
          retention-days: 14
          if-no-files-found: error
